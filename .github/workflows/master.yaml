name: Publish

on:
    push:
        branches: ["master", "main"]

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: valitydev/action-frontend/setup-install@v3
              with:
                  release: true
            - name: Build
              run: npm run build
            - uses: valitydev/action-frontend/publish@v3
